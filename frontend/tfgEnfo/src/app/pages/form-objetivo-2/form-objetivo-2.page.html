<ion-content class="registro-content">

  <div class="marcoPC" [ngClass]="{ 'error': hasError() }">

    <div class="header-section">
      <app-progress-bar [progress]="progress"></app-progress-bar>
      <p>
        ¡Bienvenido <span class="username">{{ usuario }}</span>!<br>
        Continúa con tu configuración personalizada.
      </p>
    </div>

    <p class="error-text" *ngIf="hasError()">
      Debes seleccionar una opción para continuar
    </p>

    <div class="botonsicos">

      <div class="butRow">
        <app-fat-button
          icon="battery-empty"
          title="Sedentario"
          description="Poco o nada de ejercicio"
          [selected]="nivelActividad === 'sedentario'"
          (select)="nivelActividad = 'sedentario'">
        </app-fat-button>

        <app-fat-button
          icon="battery-quarter"
          title="Ligeramente activo"
          description="Ejercicio 1 o 2 días a la semana"
          [selected]="nivelActividad === 'ligero'"
          (select)="nivelActividad = 'ligero'">
        </app-fat-button>
      </div>

      <div class="butRow">
        <app-fat-button
          icon="battery-half"
          title="Moderadamente activo"
          description="Ejercicio 3 o 4 días a la semana"
          [selected]="nivelActividad === 'moderado'"
          (select)="nivelActividad = 'moderado'">
        </app-fat-button>

        <app-fat-button
          icon="battery-three-quarters"
          title="Muy activo"
          description="Ejercicio 5 o 6 días a la semana"
          [selected]="nivelActividad === 'alto'"
          (select)="nivelActividad = 'alto'">
        </app-fat-button>
      </div>

      <app-fat-button
        icon="battery-full"
        title="Atleta profesional"
        description="Ejercicio 7 días a la semana"
        [selected]="nivelActividad === 'atleta'"
        (select)="nivelActividad = 'atleta'">
      </app-fat-button>

    </div>

    <div class="flechas">
      <ng-container *ngIf="!isPC; else botonesPC">
        <app-flecha-button direction="left" (click)="goBack()"></app-flecha-button>
        <app-flecha-button direction="right" (click)="validateAndNavigate()"></app-flecha-button>
      </ng-container>

      <ng-template #botonesPC>
        <app-button
          text="Anterior"
          (click)="goBack()"
          class="btn-anterior">
        </app-button>

        <app-button
          text="Siguiente"
          (click)="validateAndNavigate()"
          class="btn-siguiente">
        </app-button>
      </ng-template>
    </div>

  </div>

</ion-content>
