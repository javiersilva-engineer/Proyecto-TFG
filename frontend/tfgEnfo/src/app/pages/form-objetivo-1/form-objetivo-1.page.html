<ion-content class="registro-content">

  <div class="marcoPC">
    <div class="header-section">
      <app-progress-bar [progress]="progress"></app-progress-bar>
      <p>
        ¡Bienvenido <span class="username">{{usuario}}</span>!<br>
        Para empezar a crear tu plan personalizado, cuéntanos un poco sobre ti.
      </p>
    </div>

    <div class="questions">
      <app-number-picker label="¿Cuál es tu objetivo?" type="kg" [(value)]="objetivoPeso"></app-number-picker>
      <app-number-picker label="¿Cuánto pesas?" type="kg" [(value)]="peso"></app-number-picker>
      <app-number-picker label="¿Cuánto mides?" type="m" [(value)]="altura"></app-number-picker>
      <app-number-picker label="¿Qué edad tienes?" type="años" [(value)]="edad"></app-number-picker>
    </div>

      

  </div>

</ion-content>
