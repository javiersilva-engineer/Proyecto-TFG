<ion-content class="registro-content">

  <div class="marcoPC">
    <div class="header-section">
      <img src="assets/imgs/logoEnfo.png" alt="EnFo Logo" class="logo" />
      <p class="slogan">Los abdominales se cocinan, no se entrenan.</p>
    </div>

    <form class="registro-form" (ngSubmit)="onSubmit()">

      <div class="inptsPC">
        <app-input label="Email*" type="email" [(value)]="email"
          [error]="errors.email || errors.emailFormat ? 'Introduce un email válido' : null"></app-input>

        <app-input label="Contraseña*" type="password" [(value)]="password"
          [error]="errors.password ? 'Contraseña incorrecta' : null"></app-input>
      </div>

      <app-button text="Iniciar sesión" type="submit"></app-button>

      <p class="login-link">¿No tienes cuenta? <app-link text="Regístrate" route="/registro"></app-link></p>

    </form>
  </div>

</ion-content>
