<ion-content class="registro-content">

  <div class="marcoPC">
    <div class="header-section">
      <img src="assets/imgs/logoEnfo.png" alt="EnFo Logo" class="logo" />
      <p class="slogan">Los abdominales se cocinan, no se entrenan.</p>
    </div>

    <form class="registro-form">

      <div class="inptsPC">
        <div class="input-group">
          <label>Email*</label>
          <input type="email" />
        </div>

        <div class="input-group">
          <label>Contraseña*</label>
          <input type="password" />
        </div>
      </div>

      <button type="submit" class="register-button">
        Iniciar sesión
      </button>

      <p class="login-link">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>

    </form>
  </div>

</ion-content>
