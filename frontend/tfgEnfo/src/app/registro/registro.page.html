<ion-content class="registro-content">

  <div class="marcoPC">
    <div class="header-section">
      <img src="assets/imgs/logoEnfo.png" alt="EnFo Logo" class="logo" />
      <p class="slogan">Los abdominales se cocinan, no se entrenan.</p>
    </div>

    <form class="registro-form">

      <div class="inptsPC">
        <div class="input-group">
          <label>Nombre de usuario*</label>
          <input type="text" />
        </div>

        <div class="input-group">
          <label>Email*</label>
          <input type="email" />
        </div>
      </div>

      <div class="inptsPC">
        <div class="input-group">
          <label>Contraseña*</label>
          <input type="password" />
        </div>

        <div class="gender-selection-container">
          <label>Sexo*</label>
          <div class="gender-buttons">
            <button type="button" class="gender-button" [class.selected]="selectedGender === 'Hombre'"
              (click)="selectGender('Hombre')">
              Hombre
            </button>
            <button type="button" class="gender-button" [class.selected]="selectedGender === 'Mujer'"
              (click)="selectGender('Mujer')">
              Mujer
            </button>
          </div>
        </div>
      </div>


      <button type="submit" class="register-button">
        Registrarse
      </button>

      <p class="login-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>

    </form>
  </div>

</ion-content>
