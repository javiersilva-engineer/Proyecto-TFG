<ion-content class="registro-content">

  <div class="marcoPC">
    <div class="header-section">
      <img src="assets/imgs/logoEnfo.png" alt="EnFo Logo" class="logo" />
      <p class="slogan">Los abdominales se cocinan, no se entrenan.</p>
    </div>

    <form class="registro-form" (ngSubmit)="onSubmit()">

      <!-- Primera fila -->
      <div class="inptsPC">

        <div class="input-group">
          <label>Nombre de usuario*</label>
          <input id="username" type="text" />
          <p class="error-text" *ngIf="errors.username">Este campo es obligatorio</p>
        </div>

        <div class="input-group">
          <label>Email*</label>
          <input id="email" type="email" />
          <p class="error-text" *ngIf="errors.email || errors.emailFormat">Introduce un email válido</p>
        </div>

      </div>

      <!-- Segunda fila -->
      <div class="inptsPC">

        <div class="input-group">
          <label>Contraseña*</label>
          <input id="password" type="password"/>
          <p class="error-text" *ngIf="errors.password">La contraseña es obligatoria</p>
        </div>

        <div class="gender-selection-container">
          <label>Sexo*</label>
          <div class="gender-buttons">
            <button type="button"
              class="gender-button"
              [class.selected]="selectedGender === 'Hombre'"
              (click)="selectGender('Hombre')">
              Hombre
            </button>

            <button type="button"
              class="gender-button"
              [class.selected]="selectedGender === 'Mujer'"
              (click)="selectGender('Mujer')">
              Mujer
            </button>
          </div>

          <p class="error-text" *ngIf="errors.gender">Selecciona un sexo</p>
        </div>

      </div>

      <button type="submit" class="register-button">Registrarse</button>

      <p class="login-link">
        ¿Ya tienes cuenta?
        <a routerLink="/login">Inicia sesión</a>
      </p>

    </form>
  </div>

</ion-content>
