<ion-content [fullscreen]="true" class="registro-content">

  <div class="header-section">
    <img src="assets/imgs/logoEnfo.png" alt="EnFo Logo" class="logo">
    <p class="slogan">Los abdominales se cocinan, no se entrenan.</p>
  </div>

  <form class="registro-form">

    <ion-item class="input-item">
      <ion-label position="stacked" class="input-label">Nombre de usuario*</ion-label>
      <ion-input type="text" placeholder="Manolito" class="styled-input"></ion-input>
    </ion-item>

    <ion-item class="input-item">
      <ion-label position="stacked" class="input-label">Email*</ion-label>
      <ion-input type="email" placeholder="manolo1234@gmail.com" class="styled-input"></ion-input>
    </ion-item>

    <ion-item class="input-item">
      <ion-label position="stacked" class="input-label">Contraseña*</ion-label>
      <ion-input type="password" placeholder="********" class="styled-input"></ion-input>
    </ion-item>

    <div class="gender-selection-container">
      <ion-label class="input-label">Sexo*</ion-label>
      <div class="gender-buttons">
        <ion-button class="gender-button unselected" fill="clear">Hombre</ion-button>
        <ion-button class="gender-button unselected" fill="clear">Mujer</ion-button>
      </div>
    </div>

    <ion-button class="register-button">
      Registrarse
    </ion-button>

    <p class="login-link">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>

  </form>

</ion-content>
